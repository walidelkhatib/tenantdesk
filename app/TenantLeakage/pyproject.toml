[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TenantLeakage"
version = "0.1.0"
description = "Code-based evaluator: flags sessions where another tenant's data appears"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=1.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
